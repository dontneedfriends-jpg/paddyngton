name: Sync shared code to paddyngton-mobile

on:
  push:
    branches: [main]
    paths:
      - 'src/types/**'
      - 'src/store/**'
      - 'src/hooks/**'
      - 'src/lib/**'
      - 'src/translations/**'
      - 'src/i18n.tsx'
      - 'src/components/dialogs/**'
      - 'src/components/panels/**'
      - 'src/components/editor/**'
      - 'src/constants/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dontneedfriends-jpg/paddyngton-mobile
          token: ${{ secrets.MOBILE_REPO_PAT }}
          path: mobile-repo

      - uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Sync shared code
        run: |
          rm -rf mobile-repo/shared
          mkdir -p mobile-repo/shared
          cp -r main-repo/src/types mobile-repo/shared/types
          cp -r main-repo/src/store mobile-repo/shared/store
          cp -r main-repo/src/hooks mobile-repo/shared/hooks
          cp -r main-repo/src/lib mobile-repo/shared/lib
          cp -r main-repo/src/translations mobile-repo/shared/translations
          cp main-repo/src/i18n.tsx mobile-repo/shared/i18n.tsx
          cp -r main-repo/src/constants mobile-repo/shared/constants
          cp -r main-repo/src/components/dialogs mobile-repo/shared/components/dialogs
          cp -r main-repo/src/components/panels mobile-repo/shared/components/panels
          cp -r main-repo/src/components/editor mobile-repo/shared/components/editor

      - name: Commit & push
        run: |
          cd mobile-repo
          git config user.name "paddyngton-bot"
          git config user.email "bot@paddyngton.app"
          git add shared/
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "sync shared code from main repo ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          fi
